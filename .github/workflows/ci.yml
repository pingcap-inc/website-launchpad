name: CI

on:
  pull_request:
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'tsconfig.json'
      - 'tailwind.config.ts'
      - 'next.config.ts'

jobs:
  ci:
    name: Lint · Type-check · Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # need base-branch history to diff the PR's changed files

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: ESLint
        run: pnpm lint

      # Advisory only: checks the pages THIS PR changed and annotates any
      # non-Title-Case headings, but never blocks the merge (continue-on-error).
      # The pre-commit hook is the local gate; this is the PR-visible reminder.
      - name: Title Case (changed pages · advisory)
        continue-on-error: true
        run: |
          BASE="${{ github.event.pull_request.base.sha }}"
          FILES=$(git diff --name-only "$BASE" HEAD -- 'src/app/**/*.tsx' | tr '\n' ' ')
          if [ -z "$(echo "$FILES" | tr -d '[:space:]')" ]; then
            echo "No changed page files — nothing to check."
            exit 0
          fi
          echo "Checking changed pages: $FILES"
          node scripts/check-title-case.mjs $FILES || {
            echo "::warning title=Title Case::Some changed headings aren't Title Case (advisory — not blocking). Run 'pnpm title-case:review' to accept each suggestion or keep the original."
            exit 1
          }

      - name: TypeScript
        run: pnpm type-check

      - name: Build
        run: pnpm build
        env:
          NEXT_TELEMETRY_DISABLED: 1
