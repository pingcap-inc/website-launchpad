name: Lighthouse CI (Preview)

on:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  deployments: read

jobs:
  lighthouse:
    name: Lighthouse audit
    runs-on: ubuntu-latest
    environment: preview

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # Buffer for Vercel deployment (Approx 30s)
      - name: Wait for Vercel Deployment
        run: sleep 40

      # 1. Get Vercel Preview URL
      - name: Vercel Preview URL
        id: vercel_preview_url
        uses: zentered/vercel-preview-url@fba568fc6d882ae788a9724d7e28dee618728771 # v1.4.0
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        with:
          vercel_project_id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel_team_id: ${{ secrets.VERCEL_TEAM_ID }}

      # 2. Extract Paths from PR Table
      - name: Extract Paths
        id: extract_url
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        env:
          VERCEL_PREVIEW_URL: ${{ steps.vercel_preview_url.outputs.preview_url }}
          VERCEL_PREVIEW_URL_ALT: ${{ steps.vercel_preview_url.outputs.url }}
        with:
          script: |
            const body = context.payload.pull_request.body || "";
            const rawBaseUrl = (process.env.VERCEL_PREVIEW_URL || process.env.VERCEL_PREVIEW_URL_ALT || "").trim();
            const extractedUrl = (rawBaseUrl.match(/https?:\/\/[^\s)]+/)?.[0] || "").replace(/\/$/, "");
            const extractedHost = rawBaseUrl.replace(/^\s*https?:\/\//, '').split(/[\s)]+/)[0].replace(/\/$/, "");
            const baseUrl = extractedUrl || (extractedHost ? `https://${extractedHost}` : "");
            
            if (!baseUrl || baseUrl === "" || baseUrl === "undefined") {
              core.setFailed(`Vercel URL not found. raw output: "${rawBaseUrl || "empty"}"`);
              return;
            }

            const regex = /\|\s*URL path\s*\|\s*([^|]+)\s*\|/i;
            const match = body.match(regex);
            
            let urlList = [];
            if (match && match[1]) {
              const rawValue = match[1].replace(/`/g, '').trim();
              if (rawValue && rawValue.toLowerCase() !== 'n/a') {
                const paths = rawValue.split(/[\s,，]+/).filter(p => p.trim() !== "");
                paths.forEach(path => {
                  const value = path.trim();
                  if (!value) return;
                  const normalizedPath = value.startsWith('/') ? value : `/${value}`;
                  const hasQueryOrHash = /[?#]/.test(normalizedPath);
                  const looksLikeFile = /\.[^/]+$/.test(normalizedPath.split(/[?#]/)[0]);
                  const formattedPath =
                    !hasQueryOrHash && !looksLikeFile && !normalizedPath.endsWith('/')
                      ? `${normalizedPath}/`
                      : normalizedPath;
                  urlList.push(`${baseUrl}${formattedPath}`);
                });
              }
            }
            
            if (urlList.length === 0) {
              core.setOutput('has_urls', 'false');
            } else {
              core.setOutput('urls', urlList.join('\n'));
              core.setOutput('has_urls', 'true');
            }

      # 3. Run Lighthouse CI with Failure Threshold
      - name: Run Lighthouse CI
        if: steps.extract_url.outputs.has_urls == 'true'
        id: lhci
        uses: treosh/lighthouse-ci-action@3e7e23fb74242897f95c0ba9cabad3d0227b9b18 # v12.6.2
        env:
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        with:
          urls: ${{ steps.extract_url.outputs.urls }}
          runs: 2
          configPath: ./.github/lighthouserc.js
          # Both must stay false: every LHR (JSON and the HTML report, which embeds
          # the JSON) contains configSettings.extraHeaders, i.e. the
          # x-vercel-protection-bypass secret from lighthouserc.js. Public storage
          # would publish it, and the action's own artifact upload would ship it
          # unredacted. The reports are redacted and uploaded by the steps below.
          uploadArtifacts: false
          temporaryPublicStorage: false
          # Fails the build if Performance is < 70
          budgetPath: |
            [
              {
                "resourceSizes": [],
                "resourceCounts": [],
                "timings": [],
                "performance": 70
              }
            ]

      # 3b. Strip the bypass secret from every report, verify it is gone, then upload.
      # Fails (and uploads nothing) if the secret is still present anywhere.
      - name: Redact protection-bypass secret from reports
        id: redact
        if: always() && steps.lhci.outcome != 'skipped'
        env:
          BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          RESULTS_DIR: ${{ steps.lhci.outputs.resultsPath || '.lighthouseci' }}
        run: |
          [ -d "$RESULTS_DIR" ] || { echo "No results at $RESULTS_DIR"; exit 0; }
          node -e '
            const fs = require("fs"), path = require("path");
            const secret = process.env.BYPASS_SECRET || "";
            const walk = (d) => fs.readdirSync(d, { withFileTypes: true }).flatMap((e) =>
              e.isDirectory() ? walk(path.join(d, e.name)) : [path.join(d, e.name)]);
            let leaks = 0;
            for (const f of walk(process.env.RESULTS_DIR)) {
              let t = fs.readFileSync(f, "utf8");
              if (secret) t = t.split(secret).join("REDACTED");
              // Also blank the header value itself, whatever it is (plain or JSON-escaped).
              t = t.replace(/(x-vercel-protection-bypass\\*"\s*:\s*\\*")[^"\\]*/gi, "$1REDACTED");
              fs.writeFileSync(f, t);
              if (secret && t.includes(secret)) leaks++;
            }
            if (leaks) { console.error(`secret still present in ${leaks} file(s)`); process.exit(1); }
            console.log("Reports redacted.");
          '
          if [ -n "$BYPASS_SECRET" ] && grep -rqF -- "$BYPASS_SECRET" "$RESULTS_DIR"; then
            echo "::error::bypass secret still present in Lighthouse reports; not uploading"
            exit 1
          fi
          echo "dir=$RESULTS_DIR" >> "$GITHUB_OUTPUT"

      - name: Upload redacted Lighthouse reports
        if: always() && steps.redact.outcome == 'success' && steps.redact.outputs.dir != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: lighthouse-results
          path: ${{ steps.redact.outputs.dir }}
          include-hidden-files: true
          retention-days: 14

      # 4. Post Results Summary
      - name: Post score comment
        if: always() && steps.lhci.outputs.manifest != ''
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        env:
          LHCI_MANIFEST: ${{ steps.lhci.outputs.manifest }}
          LHCI_LINKS: ${{ steps.lhci.outputs.links }}
        with:
          script: |
            const manifest = JSON.parse(process.env.LHCI_MANIFEST);
            const links = JSON.parse(process.env.LHCI_LINKS || '{}');
            const emoji = s => s >= 0.9 ? '🟢' : s >= 0.7 ? '🟡' : '🔴';
            
            let tableHeader = [
              '## 🔦 Lighthouse CI Report',
              '',
              '| Page Path | Performance | Access. | SEO | Report |',
              '|:---        |:---:       |:---:    |:---: |:---:  |'
            ];

            const normalizeUrl = (value) => {
              try {
                const u = new URL(value);
                return `${u.origin}${u.pathname}`.replace(/\/$/, '');
              } catch {
                return String(value || '').replace(/\/$/, '');
              }
            };

            const getReportUrl = (entryUrl, entry) => {
              if (entry?.htmlReport) return entry.htmlReport;
              if (entry?.report) return entry.report;

              if (links[entryUrl]) return links[entryUrl];

              const normalizedEntryUrl = normalizeUrl(entryUrl);
              const directMatchKey = Object.keys(links).find(
                (key) => normalizeUrl(key) === normalizedEntryUrl
              );
              if (directMatchKey) return links[directMatchKey];

              const entryPath = (() => {
                try {
                  return new URL(entryUrl).pathname.replace(/\/$/, '') || '/';
                } catch {
                  return '';
                }
              })();

              const pathMatchKey = Object.keys(links).find((key) => {
                try {
                  return (new URL(key).pathname.replace(/\/$/, '') || '/') === entryPath;
                } catch {
                  return false;
                }
              });
              if (pathMatchKey) return links[pathMatchKey];

              return '#';
            };

            const tableRows = manifest.map((entry) => {
              const { url, summary } = entry;
              const pageUrl = url;
              const pagePath = (() => {
                try {
                  return new URL(pageUrl).pathname || '/';
                } catch {
                  return pageUrl;
                }
              })();
              const reportUrl = getReportUrl(pageUrl, entry);
              const format = (val) => `${Math.round(val * 100)} ${emoji(val)}`;
              
              return `| [\`${pagePath}\`](${pageUrl}) | ${format(summary.performance)} | ${format(summary.accessibility)} | ${format(summary.seo)} | [Lighthouse Report](${reportUrl}) |`;
            });

            const body = [
              ...tableHeader, 
              ...tableRows, 
              '', 
              '**Threshold:** Performance must be ≥ 70 🟡',
              '🟢 ≥90 · 🟡 70–89 · 🔴 <70'
            ].join('\n');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
