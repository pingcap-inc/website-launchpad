name: Deploy CDN

on:
  push:
    branches:
      - main

permissions:
  contents: read
  # Lets configure-aws-credentials exchange this run's GitHub OIDC token for
  # short-lived STS credentials (no stored AWS key) once AWS_DEPLOY_ROLE_ARN is set.
  id-token: write

jobs:
  deploy-cdn:
    name: Upload static assets to CDN
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build
        env:
          NEXT_TELEMETRY_DISABLED: 1
          NODE_ENV: production
          NEXT_PUBLIC_ASSET_PREFIX: /launchpad

      # Preferred: GitHub OIDC → IAM role (set repo/environment variable AWS_DEPLOY_ROLE_ARN).
      - name: Configure AWS credentials (OIDC)
        if: vars.AWS_DEPLOY_ROLE_ARN != ''
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: website-launchpad-deploy-${{ github.run_id }}
          aws-region: ${{ vars.AWS_REGION || secrets.AWS_REGION }}

      # Fallback until the role exists. Delete this step and the AWS_ACCESS_KEY_ID /
      # AWS_SECRET_ACCESS_KEY secrets once the OIDC step has run successfully.
      - name: Configure AWS credentials (static keys, legacy)
        if: vars.AWS_DEPLOY_ROLE_ARN == ''
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Sync public images to S3
        run: |
          aws s3 sync public/ s3://uploads-pingcap-com/launchpad/ \
            --cache-control "public,max-age=86400"
